services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: pharma-mqtt-edge
    profiles: ["streaming"]
    ports:
      - "1884:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null 2>&1"]
      interval: 10s
      timeout: 6s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: pharma-kafka
    hostname: kafka
    profiles: ["streaming"]
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: pharma-kafka-init
    profiles: ["streaming"]
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pharma.sensor.raw.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pharma.sensor.dlq.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe
    restart: "no"

  mqtt-kafka-bridge:
    build:
      context: .
      dockerfile: infra/runtime/Dockerfile
    container_name: pharma-mqtt-kafka-bridge
    profiles: ["streaming"]
    depends_on:
      mosquitto:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: pharma/production/site-042/#
      MQTT_BROKER_ALIAS: mqtt-edge-042
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_RAW_TOPIC: pharma.sensor.raw.v1
      METRICS_PORT: 9108
    command: ["python", "src/mqtt_to_kafka.py"]
    ports:
      - "9108:9108"
    restart: unless-stopped

  kafka-postgres-consumer:
    build:
      context: .
      dockerfile: infra/runtime/Dockerfile
    container_name: pharma-kafka-postgres-consumer
    profiles: ["streaming"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_RAW_TOPIC: pharma.sensor.raw.v1
      KAFKA_DLQ_TOPIC: pharma.sensor.dlq.v1
      KAFKA_CONSUMER_GROUP: pharma-postgres-raw-v1
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: pharma_analytics
      PGUSER: pharma_data
      PGPASSWORD: pharma_local_only
      METRICS_PORT: 9109
    command: ["python", "src/kafka_to_postgres.py"]
    ports:
      - "9109:9109"
    restart: unless-stopped

  airflow:
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    container_name: pharma-airflow
    profiles: ["orchestration"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 60
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      PROJECT_ROOT: /opt/airflow/project
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: pharma_analytics
      PGUSER: pharma_data
      PGPASSWORD: pharma_local_only
      DBT_SCHEMA: analytics
    command: standalone
    ports:
      - "8088:8080"
    volumes:
      - airflow_home:/opt/airflow
      - ./airflow:/opt/airflow/dags:ro
      - ./:/opt/airflow/project
    healthcheck:
      test: ["CMD-SHELL", "airflow dags list >/dev/null 2>&1"]
      interval: 20s
      timeout: 15s
      retries: 20
      start_period: 80s
    restart: unless-stopped

  spark-init:
    image: apache/spark:4.2.0
    profiles: ["distributed"]
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 185:185 /opt/spark/events"]
    volumes:
      - spark_events:/opt/spark/events
    restart: "no"

  spark-master:
    image: apache/spark:4.2.0
    container_name: pharma-spark-master
    hostname: spark-master
    profiles: ["distributed"]
    depends_on:
      spark-init:
        condition: service_completed_successfully
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      SPARK_DAEMON_MEMORY: 384m
    ports:
      - "7077:7077"
      - "8090:8080"
    volumes:
      - ./data/lake:/opt/spark/data
      - spark_events:/opt/spark/events
    restart: unless-stopped

  spark-worker-1:
    image: apache/spark:4.2.0
    container_name: pharma-spark-worker-1
    hostname: spark-worker-1
    profiles: ["distributed"]
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "1"
      - --memory
      - 640m
      - --webui-port
      - "8081"
    environment:
      SPARK_DAEMON_MEMORY: 384m
    ports:
      - "8091:8081"
    volumes:
      - ./data/lake:/opt/spark/data
      - spark_events:/opt/spark/events
    restart: unless-stopped

  spark-worker-2:
    image: apache/spark:4.2.0
    container_name: pharma-spark-worker-2
    hostname: spark-worker-2
    profiles: ["distributed"]
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "1"
      - --memory
      - 640m
      - --webui-port
      - "8081"
    environment:
      SPARK_DAEMON_MEMORY: 384m
    ports:
      - "8092:8081"
    volumes:
      - ./data/lake:/opt/spark/data
      - spark_events:/opt/spark/events
    restart: unless-stopped

  spark-submit:
    image: apache/spark:4.2.0
    container_name: pharma-spark-submit
    profiles: ["distributed"]
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --conf
      - spark.cores.max=2
      - --conf
      - spark.executor.cores=1
      - --conf
      - spark.executor.memory=512m
      - --conf
      - spark.driver.host=spark-submit
      - --conf
      - spark.eventLog.enabled=true
      - --conf
      - spark.eventLog.dir=file:///opt/spark/events
      - /opt/spark/jobs/cold_chain_distributed_metrics.py
    volumes:
      - ./spark:/opt/spark/jobs:ro
      - ./data/lake:/opt/spark/data
      - spark_events:/opt/spark/events
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: pharma-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    container_name: pharma-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: pharma_admin_local_only
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3002:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_logs:
  kafka_data:
  airflow_home:
  spark_events:
  prometheus_data:
  grafana_data:
