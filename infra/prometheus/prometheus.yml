global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: mqtt-kafka-bridge
    static_configs:
      - targets: ["mqtt-kafka-bridge:9108"]

  - job_name: kafka-postgres-consumer
    static_configs:
      - targets: ["kafka-postgres-consumer:9109"]
